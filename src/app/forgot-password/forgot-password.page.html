<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <button (click)="navBack()" class="backicon"> <ion-icon style="font-size:24px;" name="arrow-back-outline"></ion-icon></button>
    </ion-buttons>
    <ion-title>Forgot Password?</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content >
  <div  [ngStyle]="{'display': formsubmitted=='0' ? 'block' : 'none'}">
  <div style="width:100%; text-align: center;margin-top: 25px;">
  <img src="../../assets/images/header-logo.png" class="signup-logo">
</div>
  <swiper-container pager="true" [options]="slideOpts" >  
    <swiper-slide>  
      <p class="slide-text">Read, Search and Compare Bibles</p>  
    </swiper-slide>  
    <swiper-slide>  
      <p class="slide-text">Add Bookmarks, Highlights & Notes</p>  
    </swiper-slide>  
    <swiper-slide>  
      <p class="slide-text">Take part in Opinion Polls & Surveys</p>  
    </swiper-slide>  
    <swiper-slide>  
      <p class="slide-text">Participate in Weekly Bible Quiz</p>  
    </swiper-slide>  
    <swiper-slide>  
      <p class="slide-text">Participate in Bible related competitions</p>  
    </swiper-slide> 
   </swiper-container>
  <div style="padding:20px;">
    <ion-item lines="full"  style="border-bottom: 1px solid #e3e3e3;">
      <ion-label position="floating" >Email</ion-label>
      <ion-input type="text" [(ngModel)]="email" required></ion-input>
    </ion-item>
  
    <ion-row>
      <ion-col style="text-align: center;">
        <button type="submit" class="btn-signin" (click)="validateLogin()" >Submit</button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col style="text-align: center;">
        <a [routerLink]="['/login']" class="small-text " style="margin-top: 20px;display:inline-block;" >Back to Sign in</a>
      </ion-col>
    </ion-row>
   

  </div>
</div>
  <div  [ngStyle]="{'display': formsubmitted=='1' ? 'block' : 'none'}" style="padding:20px;font-size:16px">
    <span style="line-height: 1.5em;">{{ verificationCodeMessage }}</span>
    <br>
    <br>
    
      <ion-input type="text" required class="textbox-verification"  [ngStyle]="{'display': resentVerificationCode!='1' ? 'block' : 'none'}" [(ngModel)]="verificationcode" maxlength="6"></ion-input>
      <ion-row>
        <ion-col style="text-align: center;">
           <button type="submit"  class="btn-signin" (click)="validateVerificationCode()" [ngStyle]="{'display': resentVerificationCode!='1' ? 'block' : 'none'}">Submit</button>
           <button type="submit"  class="btn-signin" (click)="this.validateLogin();"[ngStyle]="{'display': resentVerificationCode=='1' ? 'block' : 'none'}">Resend</button>
      </ion-col>
      </ion-row>

  </div>
</ion-content>
