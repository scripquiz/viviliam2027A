<ion-content>
  <div style="width: 100%; height: 100px; position: fixed; margin-top: -3px">
    <div style="width: 100%">
      <div
        style="
          width: 100%;
          display: inline-flex;
          padding-left: 15px;
          padding-right: 15px;
          padding-top: 10px;
          padding-bottom: 5px;
        "
      >
        <div
          style="
            width: 90%;
            height: 48px;
            display: flex;
            margin-top: 10px;
            border: 1px solid #2e353d;
            border-radius: 25px;
            padding-left: 5px;
          "
        >
          <ion-item class="search-input">
            <ion-input
              class="search-input"
              inputmode="text"
              [readonly]="searchInprocess"
              (ionFocus)="handleInputFocus()"
              (keyup.enter)="initiateSearchBible()"
              [(ngModel)]="searchText"
              type="text"
              placeholder="Search"
            ></ion-input>
          </ion-item>
          <button
            style="
              width: 35px;
              background-color: transparent;
              display: inline-block;
            "
            (click)="initiateSearchBible()"
          >
            <ion-icon
              style="
                font-size: 24px;
                top: 2px;
                position: relative;
                color: var(--app-text-primary);
              "
              name="arrow-forward-outline"
            ></ion-icon>
          </button>
        </div>
        <div
          style="width: calc(30px); display: inline-block; text-align: right"
        >
          <ion-menu-toggle>
            <button
              style="
                background-color: transparent;
                position: relative;
                top: 5px;
              "
            >
              <ion-icon
                class="search-gear"
                name="settings-outline"
                style="color: var(--app-text-primary)"
              ></ion-icon>
            </button>
          </ion-menu-toggle>
        </div>
      </div>
    </div>

    <div class="search-info">{{ authservice.searchInfo }}</div>
    <div class="searchresultnavigation {{ showSearchNavigation }}">
      <div class="nav-container">
        <button class="search-nav-left" (click)="gotoPrevPage()">
          <ion-icon
            name="chevron-back"
            style="font-size: 26px; color: var(--app-text-primary)"
          ></ion-icon>
        </button>

        <span class="pages">{{ pager }}</span>

        <button class="search-nav-right" (click)="gotoNextPage()">
          <ion-icon
            name="chevron-forward"
            style="font-size: 26px; color: var(--app-text-primary)"
          ></ion-icon>
        </button>

        <ion-input
          type="number"
          [(ngModel)]="gotoPage"
          class="search-input-pageno textbox"
          (keyup.enter)="gotoPageNumber()"
        ></ion-input>

        <button class="btn-go" (click)="gotoPageNumber()">
          <ion-icon
            name="arrow-forward"
            style="font-size: 24px; color: var(--app-text-primary)"
          ></ion-icon>
        </button>
      </div>
      <div class="search-info" style="margin-left: auto; margin-right: auto">
        {{ searchinfo }}
      </div>
    </div>
  </div>
  <div class="searchversedata {{ showverse }}">
    @for (verseItem of verseList; track verseItem; let i = $index) {
    <div
      id="item{{verseItem.sn}}"
      text-wrap
      [innerHTML]="verseItem.verseData"
      tappable
      text-wrap
      (click)="selectItemFromSearch(verseItem.bibleid, verseItem.booknumber, verseItem.cnumber, verseItem.vnumber)"
    ></div>
    }
  </div>
  <div style="width: 100%; text-align: center; z-index: 0">
    <img
      src="../../assets/images/viviliam-search.png"
      class="search-pic"
      [ngStyle]="{'display':search_submited==0 ? 'block':'none'}"
    />
  </div>
</ion-content>
