<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <button (click)="navBack()" class="backicon"> <ion-icon style="font-size:24px;" name="arrow-back-outline"></ion-icon></button>
    </ion-buttons>
    <ion-title>{{PageTitle}}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content >
  <div style="width:100%; text-align: center;margin-top: 25px;">
  <h1>{{PageTitle}}</h1>
</div>

  <div style="padding:20px;width:100%">
    <ion-item lines="full" style="border-bottom: 1px solid #bababa;width:100%" [ngStyle]="{'display': authservice.userId_ForgotPassword!='' ? 'none' : 'inline-block'}">
      <ion-label position="floating">Old Password</ion-label>
      <ion-input type="password"  [(ngModel)]="oldpassword" maxlength="16" [type]="oldPasswordType" required></ion-input>
      <ion-icon item-end [name]="oldPasswordIcon" class="passwordIcon" (click)='hideShowOldPassword()'></ion-icon>
    </ion-item>
    <ion-item lines="full" style="border-bottom: 1px solid #bababa;width:100%">
      <ion-label position="floating">New Password</ion-label>
      <ion-input type="password" [(ngModel)]="newpassword" maxlength="16" [type]="newPasswordType" required></ion-input>
      <ion-icon item-end [name]="newPasswordIcon" class="passwordIcon" (click)='hideShowNewPassword()'></ion-icon>
    </ion-item>
    <ion-item lines="full" style="border-bottom: 1px solid #bababa;width:100%">
      <ion-label position="floating">Confirm password</ion-label>
      <ion-input type="password" [(ngModel)]="retypepassword" maxlength="16" [type]="confirmPasswordType" required></ion-input>
      <ion-icon item-end [name]="confirmPasswordIcon" class="passwordIcon" (click)='hideShowConfirmPassword()'></ion-icon>
    </ion-item>
    <ion-row>
      <ion-col style="text-align: center;">
        <button type="submit" class="btn-signin" (click)="updatePassword()" >Submit</button>
      </ion-col>
    </ion-row>
 

  </div>
</ion-content>
