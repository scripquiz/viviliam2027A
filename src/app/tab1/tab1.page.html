<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1 1ss
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab</ion-title>
    </ion-toolbar>
  </ion-header>
  <p>
    <ion-item>
      <ion-textarea [(ngModel)]="CopyInputText"></ion-textarea>
    </ion-item>
    <ion-button color="primary" (click)="copyString()">Copy</ion-button>
  </p>
  <p>
    <ion-item>
      <ion-textarea [(ngModel)]="PasteText"></ion-textarea>
    </ion-item>
    <ion-button color="success" (click)="pasteText()">Paste Text String Here</ion-button>
    <ion-button color="danger" (click)="clearText()">Clear</ion-button>
  </p>
  <p>
    <ion-button color="success" (click)="shareWhatsapp()">Share</ion-button>
    <ion-button color="success" (click)="appVersion()">Version</ion-button>
    <ion-button color="success" (click)="orientation()">Orientation</ion-button>
    <ion-button color="success" (click)="showtoast()">Toast</ion-button>
    <ion-button color="success" (click)="keepAwake()">Keep Awake</ion-button>
    <ion-button color="success" (click)="sleepAgain()">Sleep Again</ion-button>
    <ion-item lines="full" style="border-bottom: 1px solid #bababa;">
      <ion-label position="floating">Email</ion-label>
      <ion-input type="text" [(ngModel)]="email"></ion-input>
    </ion-item>
    <ion-item lines="full" style="border-bottom: 1px solid #bababa;">
      <ion-label position="floating">Password</ion-label>
      <ion-input type="password" [(ngModel)]="password" [type]="password" required></ion-input>

    </ion-item>
    <ion-button color="success" (click)="validateLogin()">Http Check</ion-button>
    <ion-button color="success" (click)="themablebrowser()">Themeable Browser</ion-button>
    <ion-button color="success" (click)="start()">Start</ion-button>
    <ion-item>
      <ion-input class="custom"></ion-input>
    </ion-item>
    <ion-item>
      <ion-select label="from id" (ionChange)="setFromBookId($event)" [(ngModel)]="fromid" placeholder="Favorite Fruit">
        <ion-select-option value="1">1</ion-select-option>
        <ion-select-option value="2">2</ion-select-option>
        <ion-select-option value="3">3</ion-select-option>
        <ion-select-option value="4">4</ion-select-option>
        <ion-select-option value="5">5</ion-select-option>
        <ion-select-option value="6">6</ion-select-option>
      </ion-select>

    </ion-item>
    <ion-item>
      <ion-select label="to id" [(ngModel)]="toid" placeholder="Favorite Fruit">
        <ion-select-option value="1">1</ion-select-option>
        <ion-select-option value="2">2</ion-select-option>
        <ion-select-option value="3">3</ion-select-option>
        <ion-select-option value="4">4</ion-select-option>
        <ion-select-option value="5">5</ion-select-option>
        <ion-select-option value="6">6</ion-select-option>
      </ion-select>
    </ion-item>

  </p>

  <ion-list>
    <ion-item id="open-modal2">
      <ion-label>Modal - Date selection</ion-label>
      <ion-note slot="end">{{dateExample | date}}</ion-note>
    </ion-item>
    <ion-modal trigger="open-modal2" [cssClass]="'bottom-end'">
      <ng-template>
        <ion-datetime presentation="date" [(ngModel)]="dateExample" size="cover"
          [showDefaultButtons]="true"></ion-datetime>
      </ng-template> </ion-modal></ion-list>
</ion-content>
